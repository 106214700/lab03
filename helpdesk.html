<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Form for booking a CWA Help Desk appointment">
    <meta name="keywords" content="HTML, form, help desk, appointment">
    <meta name="author" content="Bui The Vinh">
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <a href="http://www.swin.edu.au"><img src="images/logo.png" alt="CWA logo" /></a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

        <fieldset>
            <legend>Student Details</legend>

            <p><label for="sid">Student ID</label>
                <input type="text" name="sid" id="sid" pattern="\d{7,10}" required="required">
            </p>
            <p><label for="gname">Given Name</label>
                <input type="text" name="gname" id="gname" maxlength="15" pattern="[A-Za-z]+" required="required">
            </p>
            <p><label for="fname">Family Name</label>
                <input type="text" name="fname" id="fname" maxlength="15" pattern="[A-Za-z]+" required="required">
            </p>

        </fieldset>

        <fieldset>
            <legend>Your unit</legend>
            <p><input type="radio" id="cos10011" name="unit" value="cos10011" required="required">
                <label for="cos10011">COS10011</label>
            </p>
            <p><input type="radio" id="cos60004" name="unit" value="cos60004" required="required">
                <label for="cos60004">COS60004</label>
            </p>
            <p><input type="radio" id="cos60007" name="unit" value="cos60007" required="required">
                <label for="cos60007">COS60007</label>
            </p>

            <p><label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor" required="required">
                    <option value="">Please Select</option>
                    <option value="QD">Quoc Dung</option>
                    <option value="MQ">Minh Quan</option>
                    <option value="TV">The Vinh</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>
            <p><label for="html">HTML</label>
                <input type="checkbox" id="html" name="topic[]" value="html" checked="checked">
            </p>
            <p><label for="css">CSS</label>
                <input type="checkbox" id="css" name="topic[]" value="css">
            </p>
            <p><label for="js">JavaScript</label>
                <input type="checkbox" id="js" name="topic[]" value="js">
            </p>
            <p><label for="php">PHP</label>
                <input type="checkbox" id="php" name="topic[]" value="php">
            </p>
            <p><label for="sql">MySQL</label>
                <input type="checkbox" id="sql" name="topic[]" value="sql">
            </p>
            <p><label for="description">Description of Issue</label>
                <textarea id="description" name="description" rows="4" cols="40"
                    placeholder="Write description of your problem here..."></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferred Date/Time</legend>
            <p><label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}"
                    required="required">
            </p>
            <p><label for="time">Time</label>
                <input type="text" name="time" id="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                    required="required">
            </p>
        </fieldset>

        <input type="submit" value="Book Appointment">
        <input type="reset" value="Reset Form">
    </form>
</body>

</html>
